# 云服务器上的生产编排。运行时布局 /opt/__APP_NAME__/{.env, data/, deploy/}
# 从 /opt/__APP_NAME__ 执行：docker compose -f deploy/docker-compose.prod.yml up -d
# nginx 反代由服务器统一的通配符方案承担：map 块加一行子域名 → 127.0.0.1:<PORT>。
# name 必须显式且全服务器唯一——缺省时按 compose 文件所在目录名（deploy）推导，
# 多应用会共享同一项目名导致互相顶掉容器。
name: __APP_NAME__
services:
  app:
    image: __APP_NAME__:latest
    container_name: __APP_NAME__
    restart: always
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - ../.env
    volumes:
      - ../data:/app/app/__APP_NAME__/data
